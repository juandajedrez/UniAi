{% extends "home.html" %}
{% block title %}Crear Evento{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Crear Evento</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'user_calendar' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
