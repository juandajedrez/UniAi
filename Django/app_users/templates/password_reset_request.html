{% extends "login.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<div class="main">
    <h2>Recuperar contraseña</h2>
    <form method="post" class="form-container">
        {% csrf_token %}
        <div class="form-group">
            <label>Usuario</label>
            <input name="username" required>
        </div>
        <button type="submit">Enviar código</button>
    </form>
</div>
{% endblock %}
