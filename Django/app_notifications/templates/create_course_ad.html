{% extends "home.html" %}
{% block title %}Nuevo Anuncio{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h2>Crear anuncio para {{ course.name }}</h2>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Publicar</button>
    <a href="{% url 'course_ads' course.id %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
